<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עולם המעריצים של נועה קירל 💗</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe6f0, #ffffff, #ffd1dc);
            margin: 0;
            padding: 20px;
            color: #333;
            text-align: center;
        }
        .header {
            background-color: #ff69b4;
            color: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        p {
            font-size: 1.2em;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 2px solid #ffb6c1;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ talkirel ✨</h1>
        <p>עולם המעריצים הקסום של נועה קירל 🩷</p>
    </div>

    <div class="card">
        <h2>🌎 הבנייה בעיצומה!</h2>
        <p>ברוכים הבאים לאתר המעריצים! בקרוב יעלו כאן עולם תלת-ממדי, חדר מוזיקה, מוזיאון וחדר סודי. 🎶💖</p>
    </div>
</body>
</html>
