<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תל קירל - עולם המעריצים הרשמי</title>
    <!-- טעינת ספריית תלת מימד Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: white;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* סרגל עליון בסגנון המשחק */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .stats-box {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #ec4899;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
            display: flex;
            gap: 15px;
        }

        .action-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.8);
        }

        /* תפריט תחתון / כפתורים מרכזיים */
        .bottom-nav {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .nav-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #f43f5e;
            padding: 12px 25px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }

        .nav-card:hover {
            background: #f43f5e;
            transform: translateY(-3px);
        }

        /* מודל / חלון קופץ */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e1b4b;
            border: 3px solid #ec4899;
            padding: 30px;
            border-radius: 20px;
            z-index: 100;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .modal h2 {
            color: #f472b6;
            margin-top: 0;
        }

        .modal input {
            width: 80%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ec4899;
            background: #0f172a;
            color: white;
            text-align: center;
            font-size: 16px;
            margin: 15px 0;
        }

        .close-modal {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- סרגל עליון -->
    <div class="top-bar">
        <div class="stats-box">
            <span>🦄 תושבים: <span id="population">28,800</span></span>
            <span>⭐ יום 18</span>
        </div>
        <button class="action-btn" onclick="openModal()">התחברות 👑</button>
    </div>

    <!-- אזור תלת מימד -->
    <div id="canvas-container"></div>

    <!-- תפריט תחתון -->
    <div class="bottom-nav">
        <div class="nav-card" onclick="alert('ברוכים הבאים לפארק החד-קרן של תל קירל! 🦄')">🦄 פארק החד-קרן</div>
        <div class="nav-card" onclick="alert('מרכז המידע של נועה קירל פתוח 24/7! ✨')">ℹ️ מרכז מידע</div>
    </div>

    <!-- חלון קופץ התחברות / תעודת תושב -->
    <div id="authModal" class="modal">
        <h2>תעודת תושב - תל קירל</h2>
        <p>הקלידי את שמך כדי לקבל אזרחות רשמית:</p>
        <input type="text" id="usernameInput" placeholder="הקלידי שם..." value="אגם">
        <br>
        <button class="action-btn" onclick="issueIdCard()" style="width: 100%;">הנפיקי תעודה 💖</button>
        <br>
        <button class="close-modal" onclick="closeModal()">סגור</button>
    </div>

    <script>
        // יצירת עולם תלת-מימד מדהים עם Three.js
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);
        scene.fog = new THREE.FogExp2(0x0b0f19, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 45);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // תאורה
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffb6c1, 1);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // קרקע העיר
        const planeGeo = new THREE.PlaneGeometry(100, 100);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.8 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // בניינים בעיר (רשת קוביות)
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x312e81, roughness: 0.5 });
        const buildings = [];
        
        for (let x = -40; x <= 40; x += 8) {
            for (let z = -40; z <= 40; z += 8) {
                if (Math.abs(x) < 10 && Math.abs(z) < 10) continue; // השארת מרכז פנוי
                const h = Math.random() * 15 + 5;
                const geom = new THREE.BoxGeometry(5, h, 5);
                const bldg = new THREE.Mesh(geom, buildingMat);
                bldg.position.set(x + (Math.random()-0.5)*2, h/2, z + (Math.random()-0.5)*2);
                scene.add(bldg);
                buildings.push(bldg);
            }
        }

        // פסל ענק של נועה קירל במרכז (מגדל מפואר)
        const statueBaseGeo = new THREE.CylinderGeometry(4, 6, 12, 16);
        const statueBaseMat = new THREE.MeshStandardMaterial({ color: 0xdb2777 });
        const statueBase = new THREE.Mesh(statueBaseGeo, statueBaseMat);
        statueBase.position.set(0, 6, 0);
        scene.add(statueBase);

        const statueTopGeo = new THREE.SphereGeometry(3, 16, 16);
        const statueTopMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, emissive: 0xdb2777, emissiveIntensity: 0.5 });
        const statueTop = new THREE.Mesh(statueTopGeo, statueTopMat);
        statueTop.position.set(0, 14, 0);
        scene.add(statueTop);

        // אנימציית סיבוב של המצלמה סביב העיר
        let angle = 0;
        function animate() {
            requestAnimationFrame(animate);
            angle += 0.003;
            camera.position.x = Math.cos(angle) * 50;
            camera.position.z = Math.sin(angle) * 50;
            camera.lookAt(0, 5, 0);
            
            // סיבוב קל לפסל
            statueTop.rotation.y += 0.01;

            renderer.render(scene, camera);
        }
        animate();

        // טיפול בשינוי גודל מסך
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // פונקציות למודל
        function openModal() {
            document.getElementById('authModal').style.display = 'block';
        }
        function closeModal() {
            document.getElementById('authModal').style.display = 'none';
        }
        function issueIdCard() {
            const name = document.getElementById('usernameInput').value;
            alert(`🎉 מזל טוב ${name}! הונפקה לך תעודת תושב רשמית של תל קירל! מספר תושב: TK-2026# ✨`);
            closeModal();
        }
    </script>
</body>
</html>
